{% extends "base.html" %}

{% block page_title %}Edit Worker: {{ worker.full_name }}{% endblock %}

{% block content %}
<div class="auth-card" style="max-width: 600px; margin: 0 auto;">
    <form method="POST">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="form-group">
                <label>Staff ID (Read Only)</label>
                <input type="text" value="{{ worker.staff_id }}" disabled>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" value="{{ worker.full_name }}" required>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" name="phone" value="{{ worker.phone }}">
            </div>
            <div class="form-group">
                <label>Role</label>
                <input type="text" name="role" value="{{ worker.role }}">
            </div>
            <div class="form-group">
                <label>Weekly Salary (GH₵)</label>
                <input type="number" name="weekly_salary" value="{{ worker.weekly_salary }}" required>
            </div>
            <div class="form-group">
                <label>Monthly Salary (GH₵)</label>
                <input type="number" name="monthly_salary" value="{{ worker.monthly_salary }}" required>
            </div>
            <div class="form-group" style="grid-column: span 2;">
                <label>Notes</label>
                <textarea name="notes" rows="3">{{ worker.notes }}</textarea>
            </div>
        </div>
        <div style="margin-top: 1.5rem; text-align: right;">
            <a href="{{ url_for('workers.profile', worker_id=worker._id) }}" class="btn btn-secondary" style="margin-right: 0.5rem;">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
